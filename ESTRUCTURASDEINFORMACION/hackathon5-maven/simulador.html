<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de Vuelos Nacionales - Equipo 5</title>
<style>
  :root {
    --fondo: #f4f6f8; --panel: #ffffff; --texto: #1d2733; --suave: #5f6b7a; --borde: #d8dee6;
    --arista: #9aa5b1; --nodo: #ffffff; --nodo-borde: #3b4a5c;
    --ruta: #e8590c; --alt: #1c7ed6; --origen: #2b8a3e; --destino: #c92a2a;
    --n1: #1c7ed6; --n2: #4dabf7; --n3: #99c9fb; --n4: #cfe4fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #12161b; --panel: #1b2128; --texto: #e6ebf1; --suave: #9aa8b8; --borde: #2f3a46;
      --arista: #5d6b7a; --nodo: #1b2128; --nodo-borde: #a9b8c9;
      --ruta: #ff922b; --alt: #5aa9f5; --origen: #51cf66; --destino: #ff6b6b;
      --n1: #4dabf7; --n2: #2f7fc5; --n3: #25608f; --n4: #1d4a6e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--borde); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--suave); }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); }
  label { display: block; font-size: 13px; margin: 8px 0 3px; color: var(--suave); }
  select, input { width: 100%; padding: 7px 8px; border: 1px solid var(--borde); border-radius: 6px; font: inherit; background: var(--panel); color: var(--texto); }
  .fila { display: flex; gap: 8px; }
  .fila > * { flex: 1; }
  button { margin-top: 10px; padding: 8px 10px; border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; background: var(--n1); color: #fff; }
  button.sec { background: transparent; color: var(--texto); border: 1px solid var(--borde); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--n1); outline-offset: 2px; }
  #aviso { display: none; margin: 12px 16px 0; padding: 10px 12px; border-radius: 8px; background: #fff3bf; color: #5c4400; border: 1px solid #f1d86b; font-size: 14px; max-width: 1168px; margin-left: auto; margin-right: auto; }
  #resultado { margin-top: 14px; font-size: 14px; line-height: 1.5; }
  #resultado .titulo { font-weight: 700; }
  #resultado .ruta { margin: 4px 0 10px; color: var(--texto); word-break: break-word; }
  #resultado .alt { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 6px 8px; background: transparent; color: var(--texto); border: 1px solid var(--borde); font-weight: 400; }
  #resultado .alt:hover { border-color: var(--alt); }
  #resultado .alt.activa { border-color: var(--alt); box-shadow: inset 3px 0 0 var(--alt); }
  .muted { color: var(--suave); }
  .leyenda { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--suave); margin-top: 8px; }
  .leyenda i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--nodo-borde); }
  svg { width: 100%; height: auto; display: block; max-height: calc(100vh - 130px); }
  .arista line { stroke: var(--arista); stroke-width: 1.4; marker-end: url(#flecha); }
  .arista text { font-size: 10px; fill: var(--suave); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
  .arista.ruta line { stroke: var(--ruta); stroke-width: 3.2; marker-end: url(#flecha-ruta); }
  .arista.ruta text { fill: var(--ruta); font-weight: 700; font-size: 11px; }
  .arista.alt line { stroke: var(--alt); stroke-width: 3.2; stroke-dasharray: 7 4; marker-end: url(#flecha-alt); }
  .arista.alt text { fill: var(--alt); font-weight: 700; font-size: 11px; }
  .nodo { cursor: pointer; }
  .nodo circle { fill: var(--nodo); stroke: var(--nodo-borde); stroke-width: 1.8; }
  .nodo .cod { font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: var(--texto); pointer-events: none; }
  .nodo .nom { font-size: 11px; fill: var(--texto); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; pointer-events: none; }
  .nodo.n1 circle { fill: var(--n1); } .nodo.n2 circle { fill: var(--n2); } .nodo.n3 circle { fill: var(--n3); } .nodo.n4 circle { fill: var(--n4); }
  .nodo.n1 .cod { fill: #fff; }
  .nodo.origen circle { stroke: var(--origen); stroke-width: 4; }
  .nodo.destino circle { stroke: var(--destino); stroke-width: 4; }
  .nodo:focus-visible circle { stroke: var(--n1); stroke-width: 4; }
</style>
</head>
<body>
<header>
  <h1>Simulador de Vuelos Nacionales (Avianca) - Equipo 5</h1>
  <p>Backend en Java con JGraphT: ruta óptima con Dijkstra y zonas de influencia con BFS. Mapa esquemático con posiciones aproximadas.</p>
</header>
<div id="aviso" role="alert"></div>
<main>
  <section class="panel" aria-label="Controles">
    <h2>Ruta óptima</h2>
    <label for="origen">Origen</label>
    <select id="origen"></select>
    <label for="destino">Destino</label>
    <select id="destino"></select>
    <label for="k">Rutas a mostrar (la óptima más alternativas)</label>
    <input id="k" type="number" min="1" max="5" value="3">
    <button id="btnRuta">Calcular ruta</button>

    <h2 style="margin-top:18px">Zona de influencia</h2>
    <label for="saltos">Saltos máximos desde el origen</label>
    <input id="saltos" type="number" min="1" max="14" value="2">
    <button id="btnZona">Mostrar zona</button>
    <button id="btnLimpiar" class="sec" style="margin-left:6px">Limpiar</button>

    <div id="resultado" aria-live="polite"><span class="muted">Elige origen y destino, o haz clic en dos aeropuertos del mapa.</span></div>
  </section>

  <section class="panel" aria-label="Mapa de la red">
    <svg id="mapa" viewBox="0 0 780 690" role="img" aria-label="Red de vuelos nacionales"></svg>
  </section>
</main>

<script>
const API = location.protocol === 'file:' ? 'http://localhost:8080' : '';
const NS = 'http://www.w3.org/2000/svg';
const R = 15;
// Posiciones aproximadas (solo para dibujar; los tiempos vienen del dataset)
const POS = {
  CTG: [390, 120], BAQ: [500, 85], SMR: [600, 60], VUP: [650, 185], BGA: [560, 290], CUC: [690, 255],
  MDE: [330, 250], MZL: [360, 340], PEI: [265, 385], AXM: [335, 445], BOG: [500, 420], EYP: [670, 410],
  CLO: [150, 470], NVA: [420, 505], LET: [690, 640]
};
const LADO = { PEI: 'izq', MZL: 'der', LET: 'izq' };

let red = null, origen = '', destino = '', ultimaRuta = null;
const $ = id => document.getElementById(id);
const codigo = n => n.split('-')[0];
const nombre = n => n.split('-').slice(1).join('-');
const aristas = {}, nodos = {};

function aviso(msg) { const a = $('aviso'); a.textContent = msg || ''; a.style.display = msg ? 'block' : 'none'; }

async function api(ruta) {
  let resp;
  try { resp = await fetch(API + ruta); }
  catch (e) { throw new Error('No se pudo conectar con el servidor Java. Inicia el backend con: java -cp "lib/*" Hackathon5.java serve'); }
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || 'Error del servidor');
  return data;
}

function el(tag, attrs, padre) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (padre) padre.appendChild(e);
  return e;
}

function dibujar() {
  const svg = $('mapa');
  svg.innerHTML = '';
  const defs = el('defs', {}, svg);
  for (const [id, color] of [['flecha', 'var(--arista)'], ['flecha-ruta', 'var(--ruta)'], ['flecha-alt', 'var(--alt)']]) {
    const marca = el('marker', { id, viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '10', markerHeight: '10', markerUnits: 'userSpaceOnUse', orient: 'auto' }, defs);
    el('path', { d: 'M0,0 L10,5 L0,10 z', style: 'fill: ' + color }, marca);
  }

  const capaAristas = el('g', {}, svg), capaNodos = el('g', {}, svg);
  for (const r of red.rutas) {
    const a = POS[codigo(r.origen)], b = POS[codigo(r.destino)];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    const g = el('g', { class: 'arista' }, capaAristas);
    el('line', { x1: a[0] + ux * R, y1: a[1] + uy * R, x2: b[0] - ux * (R + 3), y2: b[1] - uy * (R + 3) }, g);
    const t = el('text', { x: a[0] + dx * 0.5, y: a[1] + dy * 0.5 - 3, 'text-anchor': 'middle' }, g);
    t.textContent = r.minutos;
    aristas[r.origen + '|' + r.destino] = g;
  }
  for (const n of red.nodos) {
    const p = POS[codigo(n)];
    const g = el('g', { class: 'nodo', tabindex: '0', role: 'button', 'aria-label': n }, capaNodos);
    el('title', {}, g).textContent = n;
    el('circle', { cx: p[0], cy: p[1], r: R }, g);
    el('text', { class: 'cod', x: p[0], y: p[1] }, g).textContent = codigo(n);
    const lado = LADO[codigo(n)] || 'abj';
    const pos = { abj: [p[0], p[1] + R + 13, 'middle'], arr: [p[0], p[1] - R - 6, 'middle'], izq: [p[0] - R - 6, p[1] + 4, 'end'], der: [p[0] + R + 6, p[1] + 4, 'start'] }[lado];
    el('text', { class: 'nom', x: pos[0], y: pos[1], 'text-anchor': pos[2] }, g).textContent = nombre(n);
    g.addEventListener('click', () => clicNodo(n));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); clicNodo(n); } });
    nodos[n] = g;
  }
}

function limpiarMapa() {
  Object.values(aristas).forEach(g => g.setAttribute('class', 'arista'));
  Object.values(nodos).forEach(g => g.setAttribute('class', 'nodo'));
  marcarExtremos();
}

function marcarExtremos() {
  if (nodos[origen]) nodos[origen].classList.add('origen');
  if (nodos[destino]) nodos[destino].classList.add('destino');
}

function resaltar(estaciones, clase) {
  Object.values(aristas).forEach(g => g.setAttribute('class', 'arista'));
  for (let i = 0; i + 1 < estaciones.length; i++) {
    const g = aristas[estaciones[i] + '|' + estaciones[i + 1]];
    if (g) g.classList.add(clase);
  }
}

function clicNodo(n) {
  if (!origen || (origen && destino)) { origen = n; destino = ''; }
  else if (n !== origen) { destino = n; }
  $('origen').value = origen; $('destino').value = destino;
  limpiarMapa();
}

function llenarSelects() {
  for (const id of ['origen', 'destino']) {
    const s = $(id);
    s.innerHTML = '<option value="">Selecciona...</option>';
    for (const n of red.nodos) { const o = document.createElement('option'); o.value = n; o.textContent = n; s.appendChild(o); }
  }
  $('origen').addEventListener('change', e => { origen = e.target.value; limpiarMapa(); });
  $('destino').addEventListener('change', e => { destino = e.target.value; limpiarMapa(); });
}

function escribir(partes) {
  const cont = $('resultado');
  cont.innerHTML = '';
  for (const p of partes) cont.appendChild(p);
}
function nodoTexto(clase, texto) { const d = document.createElement('div'); d.className = clase; d.textContent = texto; return d; }

async function calcularRuta() {
  aviso('');
  if (!origen || !destino) { escribir([nodoTexto('muted', 'Selecciona un origen y un destino.')]); return; }
  if (origen === destino) { escribir([nodoTexto('muted', 'El origen y el destino son el mismo aeropuerto (0 minutos).')]); return; }
  try {
    const k = Math.max(1, Math.min(5, parseInt($('k').value, 10) || 1));
    const d = await api('/api/ruta?origen=' + encodeURIComponent(origen) + '&destino=' + encodeURIComponent(destino) + '&k=' + k);
    limpiarMapa();
    if (!d.optima) {
      escribir([nodoTexto('titulo', 'Sin ruta disponible'), nodoTexto('muted', 'No hay vuelos que lleven de ' + origen + ' a ' + destino + '. El dataset es dirigido: las rutas solo existen en el sentido indicado.')]);
      return;
    }
    resaltar(d.optima.estaciones, 'ruta');
    const partes = [
      nodoTexto('titulo', 'Ruta óptima (Dijkstra): ' + d.optima.minutos + ' min, ' + d.optima.tramos + ' tramos'),
      nodoTexto('ruta', d.optima.estaciones.join(' → '))
    ];
    if (d.alternativas.length) {
      partes.push(nodoTexto('titulo', 'Alternativas (clic para ver en el mapa)'));
      d.alternativas.forEach((alt, i) => {
        const b = document.createElement('button');
        b.className = 'alt';
        b.textContent = (i + 2) + '. ' + alt.minutos + ' min (+' + (alt.minutos - d.optima.minutos) + ') · ' + alt.tramos + ' tramos: ' + alt.estaciones.map(codigo).join(' → ');
        b.addEventListener('click', () => {
          document.querySelectorAll('#resultado .alt').forEach(x => x.classList.remove('activa'));
          b.classList.add('activa');
          resaltar(alt.estaciones, 'alt');
        });
        partes.push(b);
      });
    } else if (k > 1) {
      partes.push(nodoTexto('muted', 'No existen más rutas distintas entre estos aeropuertos.'));
    }
    escribir(partes);
  } catch (e) { aviso(e.message); }
}

async function mostrarZona() {
  aviso('');
  if (!origen) { escribir([nodoTexto('muted', 'Selecciona un aeropuerto de origen.')]); return; }
  try {
    const saltos = Math.max(1, Math.min(14, parseInt($('saltos').value, 10) || 1));
    const d = await api('/api/zona?inicio=' + encodeURIComponent(origen) + '&saltos=' + saltos);
    limpiarMapa();
    const partes = [nodoTexto('titulo', 'Zona de influencia de ' + origen + ' (BFS, hasta ' + saltos + ' saltos)')];
    let total = 0;
    d.niveles.forEach((lista, i) => {
      lista.forEach(n => nodos[n].classList.add('n' + Math.min(i + 1, 4)));
      total += lista.length;
      partes.push(nodoTexto('', 'Nivel ' + (i + 1) + ' (' + lista.length + '): ' + lista.join(', ')));
    });
    if (!total) partes.push(nodoTexto('muted', 'Desde este aeropuerto no sale ningún vuelo.'));
    partes.push(nodoTexto('muted', 'BFS cuenta saltos, no minutos: no usa los tiempos de las rutas.'));
    const ley = document.createElement('div');
    ley.className = 'leyenda';
    ley.innerHTML = '<span><i style="background:var(--n1)"></i>1 salto</span><span><i style="background:var(--n2)"></i>2 saltos</span><span><i style="background:var(--n3)"></i>3 saltos</span><span><i style="background:var(--n4)"></i>4 o más</span>';
    partes.push(ley);
    escribir(partes);
  } catch (e) { aviso(e.message); }
}

function limpiar() {
  origen = ''; destino = '';
  $('origen').value = ''; $('destino').value = '';
  aviso('');
  limpiarMapa();
  escribir([nodoTexto('muted', 'Elige origen y destino, o haz clic en dos aeropuertos del mapa.')]);
}

async function iniciar() {
  try {
    red = await api('/api/red');
    dibujar();
    llenarSelects();
    $('btnRuta').addEventListener('click', calcularRuta);
    $('btnZona').addEventListener('click', mostrarZona);
    $('btnLimpiar').addEventListener('click', limpiar);
  } catch (e) { aviso(e.message); }
}
iniciar();
</script>
</body>
</html>
